{% extends 'base.html' %}{% block content %}<div class="card border-0 shadow-sm form-card"><div class="card-body p-4"><h3 class="fw-bold">Registrar pago</h3><div class="alert alert-light border">Vivienda <strong>{{ cuota.vivienda.numero }}</strong> · Semana {{ cuota.fecha_inicio|date:'d/m' }} - {{ cuota.fecha_fin|date:'d/m' }} · Cuota ${{ cuota.monto }}</div><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success"><i class="bi bi-check2-circle"></i> Confirmar pago</button> <a href="{% url 'lista_pagos' %}" class="btn btn-light">Cancelar</a></form></div></div>{% endblock %}
