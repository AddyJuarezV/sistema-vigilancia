{% extends "base.html" %}

{% block title %}Registrar pago{% endblock %}

{% block content %}

<h2>Registrar pago</h2>

<div class="card border-0 shadow-sm mt-4">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Registrar pago
            </button>
        </form>

    </div>
</div>

{% endblock %}
