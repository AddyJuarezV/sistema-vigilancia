{% extends "base.html" %}

{% block title %}Nueva cuota{% endblock %}

{% block content %}

<h2>Nueva cuota</h2>

<div class="card border-0 shadow-sm mt-4">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Guardar cuota
            </button>
        </form>

    </div>
</div>

{% endblock %}
