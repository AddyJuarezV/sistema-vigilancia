{% extends "base.html" %}

{% block title %}Registrar vivienda{% endblock %}

{% block content %}

<h2>Registrar vivienda</h2>

<div class="card shadow-sm mt-4">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Guardar vivienda
            </button>
        </form>

    </div>
</div>

{% endblock %}
