<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · VigiControl</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>body{min-height:100vh;background:radial-gradient(circle at top,#1e40af 0,#0f172a 45%,#020617 100%);display:grid;place-items:center}.login{width:min(430px,92vw);border:0;border-radius:24px}.icon{width:72px;height:72px;border-radius:20px;background:#2563eb;color:white;display:grid;place-items:center;font-size:34px;margin:auto}.form-control{padding:12px 14px;border-radius:11px}</style></head><body>
<div class="card login shadow-lg"><div class="card-body p-5"><div class="icon mb-3"><i class="bi bi-shield-lock"></i></div><h2 class="text-center fw-bold">VigiControl</h2><p class="text-muted text-center mb-4">Sistema Integral de Vigilancia</p>
{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
<form method="post">{% csrf_token %}<label class="form-label fw-semibold">Usuario</label><input class="form-control mb-3" type="text" name="username" required autofocus><label class="form-label fw-semibold">Contraseña</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100 py-2 fw-semibold"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</button></form></div></div></body></html>
